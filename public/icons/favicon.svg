  </g>
  <g transform="rotate(26 430 440)">
    <rect x="422" y="150" width="16" height="44" fill="#8a5a3c" stroke="#1d1b3a" stroke-width="10"/>
    <circle cx="430" cy="138" r="34" fill="#4caf50" stroke="#1d1b3a" stroke-width="12"/>
  </g>

  <!-- 放大鏡：硬陰影 → 握把 → 鏡框 → 鏡片內容 → 反光 -->
