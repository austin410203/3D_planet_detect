  <rect x="752" y="770" width="190" height="78" rx="34" transform="rotate(45 752 770) translate(0 -39)" fill="#ff8a3c" stroke="#1d1b3a" stroke-width="22" stroke-linejoin="round"/>
  <circle cx="655" cy="650" r="172" fill="#1d1b3a"/>
  <circle cx="655" cy="650" r="158" fill="#eafcff"/>
  <g clip-path="url(#lensClip)">
