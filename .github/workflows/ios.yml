# iOS 建置：在 GitHub 的 macOS 機器上編譯 iOS App，並在 iPhone 模擬器啟動、截圖
# commit 訊息含 [shots] 時另外拍商店截圖：繁中／英／日／韓 × 6.9 吋 iPhone、13 吋 iPad，各 5 個畫面
# 結果（編譯錯誤、截圖、App 紀錄）推到 ci-results 分支，沒有 Mac 也能用 git 取回查看：
#   git fetch origin ci-results && git show origin/ci-results:summary.txt
name: iOS 建置

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'main.js'
      - 'index.html'
      - 'style.css'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 推送 ci-results 分支

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 建置網頁並同步到 iOS
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: 編譯（iOS 模擬器，不簽章）
        id: build
        run: |
          mkdir -p ci-out
          xcodebuild -version | tee ci-out/xcode.txt
          set +e
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > ci-out/build-full.log 2>&1
          STATUS=$?
          set -e
          echo "$STATUS" > ci-out/build-status.txt
          grep -E -B2 -A4 "error:|fatal error" ci-out/build-full.log | head -400 > ci-out/errors.txt || true
          grep -E "warning:.*\.swift" ci-out/build-full.log | sort -u | head -100 > ci-out/swift-warnings.txt || true
          tail -150 ci-out/build-full.log > ci-out/build-tail.log
          rm ci-out/build-full.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ -s ci-out/errors.txt ]; then while read -r line; do echo "::error::$line"; done < <(grep -E "error:" ci-out/errors.txt | head -20); fi

      - name: 在 iPhone 模擬器啟動並截圖
        if: steps.build.outputs.status == '0'
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          for rt in sorted(devs, reverse=True):
              if 'iOS' in rt:
                  for d in devs[rt]:
                      if d['name'].startswith('iPhone'):
                          print(d['udid']); sys.exit()
          ")
          xcrun simctl list devices available | grep "$UDID" | tee ci-out/simulator.txt
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          # 啟動 App 並即時收集輸出（含重試，見 scripts/ci-launch-app.sh）
          bash scripts/ci-launch-app.sh "$UDID" ci-out/app-stdout.log | tee ci-out/launch.txt
          sleep 20
          xcrun simctl io "$UDID" screenshot ci-out/launch-20s.png
          sleep 15
          xcrun simctl io "$UDID" screenshot ci-out/launch-35s.png
          xcrun simctl terminate "$UDID" com.austin410203.planetlostfound || true
          sleep 2
          # 只保留外掛呼叫、JS console 與錯誤
          grep -E "⚡️|rror|xception|GameCenter|Store|Haptics|Preferences|App " ci-out/app-stdout.log | tr -d '\r' | cut -c1-400 | head -300 > ci-out/app.log || true
          rm -f ci-out/app-stdout.log
          # 自寫的原生外掛一定要真的被呼叫到（沒註冊時 JS 會直接回傳「未實作」，畫面看起來仍正常）
          MISSING=""
          for call in "GameCenter signIn" "Store getEntitlements" "Store getProducts"; do
            grep -q "To Native ->  $call" ci-out/app.log || MISSING="$MISSING [$call]"
          done
          if [ -n "$MISSING" ]; then echo "缺少原生呼叫：$MISSING" | tee ci-out/plugin-check.txt; echo "::error::原生外掛沒有被呼叫：$MISSING"; exit 1; fi
          echo "OK：GameCenter、Store 外掛都有原生呼叫" | tee ci-out/plugin-check.txt

      - name: 商店截圖（commit 訊息含 [shots] 或手動觸發時）
        # 外掛檢查失敗也照樣截圖（截圖只看畫面，失敗原因看 plugin-check.txt）
        if: always() && steps.build.outputs.status == '0' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]'))
        run: |
          # 截圖版網頁：含 src/demo.js 自動展示；每種語言各建一份 App（VITE_SHOT_LANG 固定語言）
          LANGS="zh en ja ko"
          for L in $LANGS; do
            VITE_SCREENSHOT=1 VITE_SHOT_LANG=$L npx vite build --outDir dist-shots-$L
            cp -R build/Build/Products/Debug-iphonesimulator/App.app App-shots-$L.app
            rm -rf App-shots-$L.app/public && cp -R dist-shots-$L App-shots-$L.app/public
          done
          mkdir -p ci-out/shots
          find_dev() {
            xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devs = json.load(sys.stdin)['devices']
          for rt in sorted(devs, reverse=True):
              if 'iOS' in rt:
                  for d in devs[rt]:
                      if re.match(sys.argv[1], d['name']):
                          print(d['udid']); sys.exit()
          " "$1"
          }
          # shoot <裝置名稱規則> <裝置代號>：開機一次，依序安裝四種語言的截圖版並拍 5 個畫面
          shoot() {
            UDID=$(find_dev "$1")
            xcrun simctl list devices | grep "$UDID" | sed "s/^/$2: /" >> ci-out/shots/devices.txt
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            for L in $LANGS; do
              TAG="$2-$L"
              xcrun simctl install "$UDID" App-shots-$L.app
              xcrun simctl ui "$UDID" appearance light
              MODE=light
              LOG="ci-out/shots/$TAG-log.txt"
              bash scripts/ci-launch-app.sh "$UDID" "$LOG" | sed "s/^/$TAG: /" >> ci-out/shots/devices.txt
              # src/demo.js 每個畫面準備好就停住，截完圖再切換淺色／深色模式通知它換下一個
              # （模擬器的紀錄會延遲、iPad 截圖本身又很慢，所以不靠時間猜；自訂網址會被 iOS 確認框擋住）
              # 數字是送出通知後，等下一個畫面準備好的秒數
              sleep 15
              for shot in select:6 intro:12 play:9 result:6 daily:0; do
                name=${shot%%:*}; settle=${shot##*:}
                xcrun simctl io "$UDID" screenshot "ci-out/shots/$TAG-$name.png"
                if [ "$MODE" = light ]; then MODE=dark; else MODE=light; fi
                xcrun simctl ui "$UDID" appearance "$MODE"
                sleep "$settle"
              done
              xcrun simctl terminate "$UDID" com.austin410203.planetlostfound || true
              grep -E "SHOT:|rror" "$LOG" | tr -d '\r' | head -40 > "$LOG.tmp"; mv "$LOG.tmp" "$LOG"
            done
            xcrun simctl shutdown "$UDID" || true
          }
          shoot '^iPhone 1[6-9] Pro Max' iphone69
          shoot '^iPad Pro 13' ipad13

      - name: 推送結果到 ci-results 分支
        if: always()
        run: |
          mkdir -p ci-out && cd ci-out
          {
            echo "sha: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "build-status: $(cat build-status.txt 2>/dev/null || echo 未執行)"
            cat xcode.txt 2>/dev/null
            cat simulator.txt 2>/dev/null
          } > summary.txt
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name=ios-ci -c user.email=ios-ci@users.noreply.github.com commit -qm "iOS CI ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

      - name: 編譯失敗時讓工作失敗
        if: steps.build.outputs.status != '0'
        run: exit 1
